[package]
name = "aero"
version = "0.2.0"
edition = "2024"
description = "A lightweight instant-replay clipper for Windows: hotkey saves the last N seconds of screen, game audio and mic."
repository = "https://github.com/WhyiMicro/Aero"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
global-hotkey = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.0"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
